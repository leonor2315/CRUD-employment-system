services:
  postgres:
    image: postgres:16
    container_name: employee-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employee_db}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-java:
    build:
      context: ./backend-java
    container_name: backend-java
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-employee_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "status=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true); [ \"$$status\" = '200' ] || [ \"$$status\" = '401' ]"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 40s

  backend-python:
    build:
      context: ./backend-python
    container_name: backend-python
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-employee_db}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s

  frontend-react:
    build:
      context: ./frontend-react
    container_name: frontend-react
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      backend-java:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    ports:
      - "5173:5173"
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5173/ > /dev/null"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
